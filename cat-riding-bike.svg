<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <title>小猫骑自行车 · 草原</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ec1f5"/>
      <stop offset="1" stop-color="#dcf2ff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#82cc6e"/>
      <stop offset="1" stop-color="#4da34d"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g transform="translate(680,78)">
    <g stroke="#f5a623" stroke-width="4" stroke-linecap="round">
      <line x1="-50" y1="0" x2="-64" y2="0"/>
      <line x1="50" y1="0" x2="64" y2="0"/>
      <line x1="0" y1="-50" x2="0" y2="-64"/>
      <line x1="0" y1="50" x2="0" y2="64"/>
      <line x1="-35" y1="-35" x2="-45" y2="-45"/>
      <line x1="35" y1="-35" x2="45" y2="-45"/>
      <line x1="-35" y1="35" x2="-45" y2="45"/>
      <line x1="35" y1="35" x2="45" y2="45"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </g>
    <circle r="34" fill="#ffd93b" stroke="#f5a623" stroke-width="3"/>
  </g>

  <!-- 云 -->
  <g fill="#ffffff" opacity="0.92">
    <g>
      <animateTransform attributeName="transform" type="translate" from="-200 0" to="900 0" dur="62s" repeatCount="indefinite"/>
      <ellipse cx="120" cy="72" rx="48" ry="22"/>
      <ellipse cx="158" cy="62" rx="34" ry="18"/>
      <ellipse cx="86" cy="64" rx="28" ry="15"/>
    </g>
    <g opacity="0.85">
      <animateTransform attributeName="transform" type="translate" from="-240 0" to="920 0" dur="90s" begin="-35s" repeatCount="indefinite"/>
      <ellipse cx="420" cy="128" rx="40" ry="18"/>
      <ellipse cx="452" cy="120" rx="28" ry="14"/>
      <ellipse cx="392" cy="122" rx="24" ry="12"/>
    </g>
  </g>

  <!-- 飞鸟 -->
  <g stroke="#5a6b7a" stroke-width="2.5" fill="none" stroke-linecap="round">
    <g>
      <animateTransform attributeName="transform" type="translate" from="850 100" to="-90 70" dur="21s" repeatCount="indefinite"/>
      <path d="M0,0 q9,-9 18,0 q9,-9 18,0"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="880 140" to="-60 110" dur="27s" begin="-9s" repeatCount="indefinite"/>
      <path d="M0,0 q8,-8 16,0 q8,-8 16,0"/>
    </g>
  </g>

  <!-- 远山丘 -->
  <ellipse cx="180" cy="462" rx="310" ry="112" fill="#9ad884"/>
  <ellipse cx="650" cy="472" rx="350" ry="122" fill="#8bd073"/>

  <!-- 草原地面 -->
  <rect y="335" width="800" height="115" fill="url(#ground)"/>

  <!-- 一棵树 -->
  <g>
    <rect x="706" y="238" width="20" height="110" rx="8" fill="#8a5a33"/>
    <circle cx="716" cy="212" r="46" fill="#3f9142"/>
    <circle cx="682" cy="232" r="32" fill="#4da34d"/>
    <circle cx="750" cy="232" r="32" fill="#4da34d"/>
  </g>

  <!-- 草丛（摇摆） -->
  <g stroke="#3d8b3d" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M60,372 q4,-18 10,-26 M72,372 q0,-20 -7,-28 M84,372 q-2,-16 -10,-24">
      <animateTransform attributeName="transform" type="rotate" values="-4 72 372;4 72 372;-4 72 372" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M330,380 q4,-18 10,-26 M342,380 q0,-20 -7,-28 M354,380 q-2,-16 -10,-24">
      <animateTransform attributeName="transform" type="rotate" values="4 342 380;-4 342 380;4 342 380" dur="2.7s" repeatCount="indefinite"/>
    </path>
    <path d="M560,368 q4,-18 10,-26 M572,368 q0,-20 -7,-28 M584,368 q-2,-16 -10,-24">
      <animateTransform attributeName="transform" type="rotate" values="-4 572 368;4 572 368;-4 572 368" dur="3.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 花 -->
  <g>
    <g>
      <line x1="170" y1="392" x2="170" y2="360" stroke="#3d8b3d" stroke-width="3"/>
      <g fill="#ff8fb3">
        <circle cx="170" cy="352" r="7"/><circle cx="161" cy="357" r="7"/>
        <circle cx="179" cy="357" r="7"/><circle cx="164" cy="364" r="7"/><circle cx="176" cy="364" r="7"/>
      </g>
      <circle cx="170" cy="358" r="5" fill="#ffd93b"/>
      <animateTransform attributeName="transform" type="rotate" values="-5 170 392;5 170 392;-5 170 392" dur="4s" repeatCount="indefinite"/>
    </g>
    <g>
      <line x1="470" y1="398" x2="470" y2="366" stroke="#3d8b3d" stroke-width="3"/>
      <g fill="#ffffff">
        <circle cx="470" cy="358" r="7"/><circle cx="461" cy="363" r="7"/>
        <circle cx="479" cy="363" r="7"/><circle cx="464" cy="370" r="7"/><circle cx="476" cy="370" r="7"/>
      </g>
      <circle cx="470" cy="364" r="5" fill="#ff9f43"/>
      <animateTransform attributeName="transform" type="rotate" values="5 470 398;-5 470 398;5 470 398" dur="3.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ============ 小猫骑车（整体横向移动） ============ -->
  <g transform="translate(0,372)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="-170 0" to="970 0" dur="9s" repeatCount="indefinite"/>

      <!-- 地面阴影 -->
      <ellipse cx="0" cy="6" rx="82" ry="8" fill="#000000" opacity="0.15"/>

      <!-- 扬尘 -->
      <g fill="#e2d6b8">
        <circle cx="0" cy="0" r="5">
          <animateTransform attributeName="transform" type="translate" values="-72 -4;-118 -16" dur="1.6s" repeatCount="indefinite"/>
          <animate attributeName="r" values="4;10" dur="1.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.7;0" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" r="5">
          <animateTransform attributeName="transform" type="translate" values="-72 -4;-118 -16" dur="1.6s" begin="-0.5s" repeatCount="indefinite"/>
          <animate attributeName="r" values="4;10" dur="1.6s" begin="-0.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.7;0" dur="1.6s" begin="-0.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" r="5">
          <animateTransform attributeName="transform" type="translate" values="-72 -4;-118 -16" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/>
          <animate attributeName="r" values="4;10" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.7;0" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- 后轮 -->
      <g>
        <circle cx="-48" cy="0" r="27" fill="none" stroke="#333333" stroke-width="6"/>
        <g stroke="#bbbbbb" stroke-width="2">
          <line x1="-48" y1="-25" x2="-48" y2="25"/>
          <line x1="-73" y1="0" x2="-23" y2="0"/>
          <line x1="-66" y1="-18" x2="-30" y2="18"/>
          <line x1="-66" y1="18" x2="-30" y2="-18"/>
          <animateTransform attributeName="transform" type="rotate" from="0 -48 0" to="360 -48 0" dur="1.1s" repeatCount="indefinite"/>
        </g>
        <circle cx="-48" cy="0" r="5" fill="#777777"/>
      </g>
      <!-- 前轮 -->
      <g>
        <circle cx="48" cy="0" r="27" fill="none" stroke="#333333" stroke-width="6"/>
        <g stroke="#bbbbbb" stroke-width="2">
          <line x1="48" y1="-25" x2="48" y2="25"/>
          <line x1="23" y1="0" x2="73" y2="0"/>
          <line x1="30" y1="-18" x2="66" y2="18"/>
          <line x1="30" y1="18" x2="66" y2="-18"/>
          <animateTransform attributeName="transform" type="rotate" from="0 48 0" to="360 48 0" dur="1.1s" repeatCount="indefinite"/>
        </g>
        <circle cx="48" cy="0" r="5" fill="#777777"/>
      </g>

      <!-- 车架 -->
      <g stroke="#e74c3c" stroke-width="6" fill="none" stroke-linecap="round">
        <path d="M-48,0 L-2,-10 L44,0"/>
        <line x1="-2" y1="-10" x2="-30" y2="-56"/>
        <line x1="-30" y1="-56" x2="34" y2="-62"/>
        <line x1="36" y1="-62" x2="44" y2="0"/>
      </g>
      <ellipse cx="-32" cy="-60" rx="13" ry="5.5" fill="#333333"/>
      <!-- 车把 -->
      <line x1="36" y1="-62" x2="29" y2="-80" stroke="#555555" stroke-width="5" stroke-linecap="round"/>
      <line x1="22" y1="-80" x2="36" y2="-80" stroke="#222222" stroke-width="7" stroke-linecap="round"/>

      <!-- 脚踏曲柄（旋转） -->
      <g>
        <circle cx="-2" cy="-10" r="6" fill="#555555"/>
        <g stroke="#333333" stroke-width="5" stroke-linecap="round">
          <line x1="-2" y1="-10" x2="14" y2="-10"/>
          <line x1="-2" y1="-10" x2="-18" y2="-10"/>
          <rect x="9" y="-14" width="11" height="7" rx="2.5" fill="#222222" stroke="none"/>
          <rect x="-24" y="-14" width="11" height="7" rx="2.5" fill="#222222" stroke="none"/>
          <animateTransform attributeName="transform" type="rotate" from="0 -2 -10" to="360 -2 -10" dur="1.1s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- 猫尾巴（摇摆） -->
      <path d="M-42,-72 Q-68,-80 -64,-112" stroke="#f6a44c" stroke-width="11" fill="none" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="-9 -42 -72;11 -42 -72;-9 -42 -72" dur="1.6s" repeatCount="indefinite"/>
      </path>

      <!-- 猫腿（踩踏） -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 9;0 0;0 -4;0 0" dur="1.1s" repeatCount="indefinite"/>
        <line x1="-24" y1="-68" x2="-10" y2="-30" stroke="#f6a44c" stroke-width="11" stroke-linecap="round"/>
        <ellipse cx="-9" cy="-28" rx="8" ry="5" fill="#e08a35"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 9;0 0;0 -4;0 0" dur="1.1s" begin="-0.55s" repeatCount="indefinite"/>
        <line x1="-12" y1="-68" x2="2" y2="-30" stroke="#ef9c3f" stroke-width="11" stroke-linecap="round"/>
        <ellipse cx="3" cy="-28" rx="8" ry="5" fill="#d97f2e"/>
      </g>

      <!-- 猫身体 -->
      <ellipse cx="-16" cy="-84" rx="27" ry="21" fill="#f6a44c"/>
      <ellipse cx="-9" cy="-78" rx="15" ry="12" fill="#fcd9a8"/>
      <g stroke="#d97f2e" stroke-width="3" stroke-linecap="round">
        <line x1="-34" y1="-96" x2="-28" y2="-88"/>
        <line x1="-26" y1="-100" x2="-20" y2="-92"/>
      </g>

      <!-- 猫前爪扶车把 -->
      <line x1="-2" y1="-86" x2="28" y2="-76" stroke="#f6a44c" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="29" cy="-76" rx="7" ry="6" fill="#e08a35"/>

      <!-- 围巾 -->
      <path d="M-32,-94 Q-10,-100 14,-95 L12,-85 Q-12,-89 -32,-83 Z" fill="#e74c3c"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0;0 5;0 0" dur="1.2s" repeatCount="indefinite"/>
        <path d="M-32,-92 Q-54,-90 -68,-102 L-60,-86 Q-50,-80 -32,-84 Z" fill="#c0392b"/>
      </g>

      <!-- 猫头（点动） -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="1.1s" repeatCount="indefinite"/>
        <polygon points="-14,-124 -8,-146 4,-128" fill="#f6a44c"/>
        <polygon points="12,-128 20,-146 26,-124" fill="#f6a44c"/>
        <polygon points="-11,-128 -8,-139 0,-130" fill="#f7b8c4"/>
        <polygon points="15,-131 19,-140 23,-130" fill="#f7b8c4"/>
        <circle cx="4" cy="-112" r="21" fill="#f6a44c"/>
        <g stroke="#d97f2e" stroke-width="2.5" stroke-linecap="round">
          <line x1="-4" y1="-130" x2="-2" y2="-124"/>
          <line x1="4" y1="-131" x2="4" y2="-125"/>
          <line x1="12" y1="-130" x2="10" y2="-124"/>
        </g>
        <circle cx="-4" cy="-114" r="3.6" fill="#333333"/>
        <circle cx="12" cy="-114" r="3.6" fill="#333333"/>
        <circle cx="-2.8" cy="-115.2" r="1.2" fill="#ffffff"/>
        <circle cx="13.2" cy="-115.2" r="1.2" fill="#ffffff"/>
        <polygon points="1,-106 9,-106 5,-101.5" fill="#e86a7a"/>
        <path d="M5,-101.5 q0,4 -5,5 M5,-101.5 q0,4 5,5" stroke="#a55c48" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g stroke="#e8e8e8" stroke-width="1.5" stroke-linecap="round">
          <line x1="-14" y1="-108" x2="-26" y2="-110"/>
          <line x1="-14" y1="-104" x2="-26" y2="-102"/>
          <line x1="22" y1="-108" x2="34" y2="-110"/>
          <line x1="22" y1="-104" x2="34" y2="-102"/>
        </g>
        <ellipse cx="-11" cy="-105" rx="4" ry="2.6" fill="#f28b8b" opacity="0.6"/>
        <ellipse cx="19" cy="-105" rx="4" ry="2.6" fill="#f28b8b" opacity="0.6"/>
      </g>

      <!-- 车篮 + 花 -->
      <g>
        <polygon points="36,-78 58,-78 54,-56 40,-56" fill="#b07a4a"/>
        <g stroke="#8a5a33" stroke-width="1.5">
          <line x1="38" y1="-72" x2="56" y2="-72"/>
          <line x1="39" y1="-66" x2="55" y2="-66"/>
          <line x1="40" y1="-61" x2="54" y2="-61"/>
        </g>
        <line x1="47" y1="-78" x2="47" y2="-90" stroke="#3d8b3d" stroke-width="3"/>
        <g fill="#ff8fb3">
          <circle cx="47" cy="-96" r="5"/><circle cx="42" cy="-93" r="5"/>
          <circle cx="52" cy="-93" r="5"/><circle cx="44" cy="-89" r="5"/><circle cx="50" cy="-89" r="5"/>
        </g>
        <circle cx="47" cy="-93" r="3.5" fill="#ffd93b"/>
      </g>
    </g>
  </g>

  <!-- 前景草丛（车从后面经过） -->
  <g stroke="#2f7a2f" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M240,428 q4,-20 10,-28 M252,428 q0,-22 -7,-30 M264,428 q-2,-18 -10,-26"/>
    <path d="M640,432 q4,-20 10,-28 M652,432 q0,-22 -7,-30 M664,432 q-2,-18 -10,-26"/>
  </g>

  <!-- 标题 -->
  <text x="24" y="44" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" opacity="0.95">小猫骑车 · 草原漫游</text>
</svg>
