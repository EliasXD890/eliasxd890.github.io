<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💬 留言板 · WarmJam 的小站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #f0f4f8; min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }
  header { text-align: center; padding: 12px 0 20px; }
  header h1 { font-size: 1.8rem; }
  header a { color: #7d97a9; font-size: .85rem; text-decoration: none; }
  header a:hover { color: #ffd93b; }
  .card {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px; padding: 22px; margin-bottom: 16px;
  }
  .card h2 { font-size: 1.15rem; margin-bottom: 14px; }
  label.f { display: block; color: #cfe3ef; font-size: .92rem; margin: 12px 0 6px; }
  input[type=text], textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px; font-size: 1rem;
    border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.3); color: #fff;
    font-family: inherit; resize: vertical;
  }
  .count { text-align: right; font-size: .78rem; color: #7d97a9; margin-top: 4px; }
  .vis { display: flex; gap: 10px; margin-top: 6px; }
  .vis label {
    flex: 1; text-align: center; padding: 10px; border-radius: 10px; cursor: pointer;
    border: 1.5px solid rgba(255,255,255,.2); color: #b9cddb; font-size: .92rem;
    transition: all .15s;
  }
  .vis input { display: none; }
  .vis input:checked + label, .vis label.on {
    border-color: #ffd93b; color: #ffd93b; background: rgba(255,217,59,.08); font-weight: 700;
  }
  .btn {
    display: inline-block; border: none; cursor: pointer;
    color: #0f2027; font-weight: 700; background: #ffd93b;
    padding: 12px 30px; border-radius: 10px; font-size: 1rem; margin-top: 16px;
    transition: transform .15s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:disabled { opacity: .5; cursor: default; transform: none; }
  #formMsg { min-height: 1.6em; font-size: .9rem; color: #b9cddb; margin-top: 10px; }
  #formMsg.ok { color: #3ddc84; font-weight: 700; }
  #formMsg.err { color: #ff5a6e; }
  .msg {
    background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
  }
  .msg .content { font-size: 1.02rem; line-height: 1.6; word-break: break-all; }
  .msg .meta { margin-top: 8px; font-size: .78rem; color: #7d97a9; }
  .msg .meta b { color: #ffd93b; font-weight: 600; }
  .empty, .loading { color: #7d97a9; text-align: center; padding: 20px 0; font-size: .9rem; }
  .hint { color: #7d97a9; font-size: .78rem; line-height: 1.7; margin-top: 8px; }
  h2.sec { font-size: 1.25rem; margin: 26px 0 14px; padding-left: 12px; border-left: 4px solid #ffd93b; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>💬 留言板</h1>
    <a href="index.html">← 返回 WarmJam 的主页</a>
  </header>

  <div class="card">
    <h2>写留言</h2>
    <label class="f" for="nick">ID / 昵称（选填）</label>
    <input type="text" id="nick" maxlength="16" placeholder="不填则用设备识别码">
    <label class="f" for="content">留言内容（最多 30 字）</label>
    <textarea id="content" rows="2" maxlength="30" placeholder="想说什么？"></textarea>
    <div class="count"><span id="ccount">0</span>/30</div>
    <label class="f">谁可见？</label>
    <div class="vis">
      <input type="radio" name="vis" id="vPublic" value="public" checked>
      <label for="vPublic" id="lvPublic" class="on">👀 全都可见</label>
      <input type="radio" name="vis" id="vPrivate" value="private">
      <label for="vPrivate" id="lvPrivate">🔒 仅 JAM 可见</label>
    </div>
    <button class="btn" id="submitBtn">发送留言</button>
    <p id="formMsg"></p>
  </div>

  <h2 class="sec">大家的留言</h2>
  <div id="list"><p class="loading">加载中…</p></div>
  <p class="hint">选择"仅 JAM 可见"的留言不会显示在这里，JAM 会单独看到。<br>留言超过 100 条时，只保留最新的 100 条。</p>
</div>

<script>
(function () {
  'use strict';
  var PUBLIC_BIN = 'https://api.npoint.io/4ccf837d3b1c1500ca05';
  var PRIVATE_BIN = 'https://api.npoint.io/56f6cc16be8f7985d032';
  var MAX_KEEP = 100;

  function getPid() {
    var pid = null;
    try { pid = localStorage.getItem('wj_pid'); } catch (e) {}
    if (!pid) {
      var chars = 'abcdefghjkmnpqrstuvwxyz23456789';
      pid = '';
      for (var i = 0; i < 6; i++) pid += chars.charAt(Math.floor(Math.random() * chars.length));
      try { localStorage.setItem('wj_pid', pid); } catch (e) {}
    }
    return pid;
  }
  function deviceLabel() {
    var ua = navigator.userAgent || '';
    if (/iPhone/i.test(ua)) return 'iPhone';
    if (/iPad/i.test(ua)) return 'iPad';
    if (/Android/i.test(ua)) return /Mobile/i.test(ua) ? 'Android 手机' : 'Android 平板';
    if (/Windows/i.test(ua)) return 'Windows 电脑';
    if (/Macintosh|Mac OS X/i.test(ua)) return 'Mac 电脑';
    if (/Linux/i.test(ua)) return 'Linux 电脑';
    return '未知设备';
  }
  var pid = getPid(), device = deviceLabel();

  function cleanStr(s, max) {
    s = String(s == null ? '' : s).replace(/[\u0000-\u001f\u007f]/g, '').trim();
    return s.length > max ? s.slice(0, max) : s;
  }
  function fmtTime(d) {
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function sanitize(list) {
    if (!Array.isArray(list)) return [];
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (!e || typeof e !== 'object') continue;
      var content = cleanStr(e.content, 30);
      if (!content) continue;
      out.push({
        pid: cleanStr(e.pid, 12) || '?',
        name: cleanStr(e.name, 16),
        device: cleanStr(e.device, 16) || '未知设备',
        content: content,
        time: cleanStr(e.time, 20)
      });
    }
    return out;
  }

  var listEl = document.getElementById('list');
  function render(list) {
    while (listEl.firstChild) listEl.removeChild(listEl.firstChild);
    if (!list.length) {
      var p = document.createElement('p');
      p.className = 'empty';
      p.textContent = '还没有留言，来抢沙发！';
      listEl.appendChild(p);
      return;
    }
    // 最新在前
    list.slice().reverse().forEach(function (e) {
      var div = document.createElement('div');
      div.className = 'msg';
      var c = document.createElement('div');
      c.className = 'content';
      c.textContent = e.content;
      var meta = document.createElement('div');
      meta.className = 'meta';
      var b = document.createElement('b');
      b.textContent = e.name || e.pid;
      meta.appendChild(b);
      meta.appendChild(document.createTextNode(' · ' + e.device + ' · ' + (e.time || '')));
      div.appendChild(c);
      div.appendChild(meta);
      listEl.appendChild(div);
    });
  }

  function load() {
    fetch(PUBLIC_BIN, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (data) {
      render(sanitize(data));
    }).catch(function () {
      listEl.innerHTML = '';
      var p = document.createElement('p');
      p.className = 'empty';
      p.textContent = '留言加载失败，请检查网络后刷新。';
      listEl.appendChild(p);
    });
  }

  // 字数统计 & 可见性切换样式
  var contentEl = document.getElementById('content');
  var ccount = document.getElementById('ccount');
  contentEl.addEventListener('input', function () { ccount.textContent = contentEl.value.length; });
  var lvPublic = document.getElementById('lvPublic'), lvPrivate = document.getElementById('lvPrivate');
  document.getElementById('vPublic').addEventListener('change', function () {
    lvPublic.classList.add('on'); lvPrivate.classList.remove('on');
  });
  document.getElementById('vPrivate').addEventListener('change', function () {
    lvPrivate.classList.add('on'); lvPublic.classList.remove('on');
  });
  document.getElementById('nick').value = (function () {
    try { return localStorage.getItem('wj_name') || ''; } catch (e) { return ''; }
  })();

  // 提交
  var submitBtn = document.getElementById('submitBtn');
  var formMsg = document.getElementById('formMsg');
  function say(t, cls) { formMsg.textContent = t; formMsg.className = cls || ''; }

  submitBtn.addEventListener('click', function () {
    var content = cleanStr(contentEl.value, 30);
    if (!content) { say('留言内容不能为空哦', 'err'); return; }
    var name = cleanStr(document.getElementById('nick').value, 16);
    try { localStorage.setItem('wj_name', name); } catch (e) {}
    var isPrivate = document.getElementById('vPrivate').checked;
    var bin = isPrivate ? PRIVATE_BIN : PUBLIC_BIN;
    var entry = {
      pid: pid,
      name: name || pid,
      device: device,
      content: content,
      time: fmtTime(new Date())
    };
    submitBtn.disabled = true;
    submitBtn.textContent = '发送中…';
    say('');
    fetch(bin, { cache: 'no-store' }).then(function (r) {
      return r.ok ? r.json() : [];
    }).catch(function () { return []; }).then(function (data) {
      var list = sanitize(data);
      list.push(entry);
      if (list.length > MAX_KEEP) list = list.slice(list.length - MAX_KEEP);
      return fetch(bin, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(list)
      });
    }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      say(isPrivate ? '🔒 已发送，仅 JAM 可见。' : '🎉 留言成功！', 'ok');
      contentEl.value = '';
      ccount.textContent = '0';
      if (!isPrivate) load();
    }).catch(function () {
      say('发送失败，请检查网络后重试。', 'err');
    }).then(function () {
      submitBtn.disabled = false;
      submitBtn.textContent = '发送留言';
    });
  });

  load();
})();
</script>
</body>
</html>
