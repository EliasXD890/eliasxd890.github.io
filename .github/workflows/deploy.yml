name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          AF6636: ${{ secrets.AF6636 }}
          BF77FF: ${{ secrets.BF77FF }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('AF6636', '')
          meta_b = os.environ.get('BF77FF', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 5973af1979fcdce0ebd8a458bbbd -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 3eb8a2a951e6afa48f5f8736e35e25fc5142ef -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
